- name: Auto Removing Uneeded Apps (Debian Based)
  tags: always
  ansible.builtin.apt:
    autoremove: yes
  when: ansible_facts['os_family'] == "Debian"

- name: Auto Removing Uneeded Apps (Fedorian Based)
  tags: always
  ansible.builtin.dnf:
    autoremove: yes
  when: ansible_facts['os_family'] == "RedHat"
