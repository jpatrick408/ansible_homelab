- name: Install Common Apps
  tags: always
  ansible.builtin.package:
    state: latest
    name:
      - tmux
      - wget
      - curl

- name: Install Build Essentials (Debian Based)
  tags: always
  ansible.builtin.apt:
    state: latest
    name: build-essential
  when: ansible_facts['os_family'] == "Debian"

- name: Install Build Essentials (Fedora Based)
  tags: always
  ansible.builtin.dnf:
    name:
      - '@development-tools'
      - automake
      - gcc
      - gcc-c++
      - kernel-devel
    state: latest
  when: ansible_facts['os_family'] == "RedHat"

- name: Install Media Plugins (Fedora)
  ansible.builtin.dnf:
    name:
#      - '@multimedia'
      - ffmpeg-free
      - ffmpeg
    allowerasing: true
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Install Hardware Media Codecs (AMD CPU Fedora)
  ansible.builtin.dnf:
    name:
      - mesa-va-drivers-freeworld
    state: latest
  when:
    - ansible_facts['processor'] == "AuthenticAMD"
    - ansible_facts['os_family'] == "RedHat"

- name: Install Hardware Media Codecs (Intel CPU Fedora)
  ansible.builtin.dnf:
    name:
      - intel-media-driver
  when:
    - ansible_facts['processor'] == "GenuineIntel"
    - ansible_facts['os_family'] == "RedHat"

- name: Check for NVIDIA GPU
  ansible.builtin.shell: lspci | grep -i nvidia
  register: nvidia_check
  ignore_errors: true
  changed_when: false

- name: Run task only if NVIDIA GPU is present
  ansible.builtin.debug:
    msg: "NVIDIA GPU detected, proceeding with installation..."
  when: nvidia_check.rc == 0

- name: Install Hardware Media Codecs (NVIDA GPU Fedora)
  ansible.builtin.dnf:
    name:
      - libva-nvidia-driver
  when:
    - ansible_facts['os_family'] == "RedHat"
