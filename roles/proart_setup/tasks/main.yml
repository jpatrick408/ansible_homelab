- name: Installing NVidia Drivers and Hardware Codecs
  ansible.builtin.dnf:
    name:
      - mesa-va-drivers
      - mesa-va-drivers-freeworld
      - akmod-nvidia
      - radeontop
      - vulkan
  when: ansible_facts['os_family'] == "RedHat"

