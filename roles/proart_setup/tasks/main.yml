- name: Creating Mount Folder (jsproart)
  ansible.builtin.file:
    path: /mnt/Gaming
    state: directory
    owner: jpatr
    group: jpatr
    mode: "0770"

- name: Mounting Second Drive (jsproart)
  ansible.posix.mount:
    src: /dev/nvme1n1p5
    path: /mnt/Gaming
    opts: 'defaults,x-gvfs-show 0 0'
    fstype: btrfs
    boot: true
    state: present
